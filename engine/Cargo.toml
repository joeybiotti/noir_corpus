[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI & core tools
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# DuckDB (uses system libduckdb installed via Homebrew)
duckdb = "1.1.3"

# Lightweight blocking HTTP fetching (prevents C++/CMake/aws-lc crate bloat)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }